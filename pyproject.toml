[project]
name = "chatbot-api"
version = "1.0.0"
description = "API de chatbot com RAG, compatível com a API da OpenAI."
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
    "limits==5.8.0",
    "openai==3.35.1",
    "sqlalchemy[asyncio]==2.1.5",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "alembic==1.20.0",
    "pypdf==6.21.3",
    "langgraph==1.2.16",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5,<0.14"
# Supply-chain cooldown: only resolve releases older than 7 days. Exceptions: FastAPI 0.162.x is
# required by the README; pypdf parses untrusted uploads and 6.21.1 has HIGH CVEs fixed in 6.21.2.
exclude-newer = "7 days"
exclude-newer-package = { fastapi = false, pypdf = false }

[tool.vercel]
entrypoint = "src.chatbot_api.asgi:app"

[tool.vercel.scripts]
build = "python -m chatbot_api.db.migrate"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C90", "ASYNC"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
addopts = "--strict-markers --cov=chatbot_api --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["chatbot_api"]
